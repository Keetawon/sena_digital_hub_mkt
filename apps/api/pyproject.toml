[project]
name = "sena-hub-api"
version = "0.1.0"
description = "SENA residential Hub: authenticated PostgreSQL publishing API"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "boto3>=1.40,<2",
  "fastapi>=0.115,<1",
  "openai-agents==0.22.3",
  "pillow>=11,<13",
  "pydantic>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "pypdf>=6,<7",
  "pypdfium2>=5,<6",
  "pythainlp>=5,<6",
  "resvg-py==0.5.0",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sena_hub_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the seeded PostgreSQL database"]
